<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Hospital Emblem Icon -->
  <g transform="translate(10, 10)">
    <!-- Base shield / health emblem -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#gradPrimary)" filter="url(#shadow)" />
    
    <!-- White Medical Cross with Soft Curves -->
    <path d="M40 20 C42 20 44 22 44 24 L44 34 L54 34 C56 34 58 36 58 38 L58 42 C58 44 56 46 54 46 L44 46 L44 56 C44 58 42 60 40 60 C38 60 36 58 36 56 L36 46 L26 46 C24 46 22 44 22 42 L22 38 C22 36 24 34 26 34 L36 34 L36 24 C36 22 38 20 40 20 Z" fill="#ffffff" />
    
    <!-- Heart / Maternity / Care Accent in Center -->
    <circle cx="40" cy="40" r="4.5" fill="url(#gradAccent)" />
    
    <!-- Pulse Line subtle accent -->
    <path d="M22 66 L30 66 L33 60 L38 72 L42 63 L46 68 L48 66 L58 66" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Typography -->
  <g transform="translate(105, 36)">
    <!-- Primary Title -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
      EKLAVYA
    </text>
    <text x="135" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#0284c7" letter-spacing="0">
      MULTISPECIALITY
    </text>
    
    <!-- Subtitle / Maternity & Trauma -->
    <text x="2" y="24" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569" letter-spacing="0.8">
      MATERNITY HOME &amp; TRAUMA CENTER
    </text>
    
    <!-- Location Badge & Quality Tag -->
    <rect x="2" y="33" width="100" height="18" rx="4" fill="#f1f5f9" />
    <text x="8" y="46" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0369a1" letter-spacing="0.5">
      📍 VYARA, GUJARAT
    </text>
    
    <text x="115" y="46" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#16a34a">
      ● 24/7 EMERGENCY
    </text>
  </g>
</svg>
